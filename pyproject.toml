[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lark-formatter"
version = "1.0.1"
description = "Local-first, scenario-driven document production workflow for Alavette Form V1.0"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "王云雀Alouette" },
]
keywords = [
    "docx",
    "document-automation",
    "local-first",
    "pyside6",
    "python-docx",
    "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
]
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "PySide6_Essentials>=6.6.0",
    "Pillow>=10.0.0",
    "lxml>=5.0.0",
    "latex2mathml>=3.77.0",
    "olefile>=0.47",
    "markdown-it-py>=4.2.0,<5.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1.0",
    "pypdfium2>=4.30.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
build = [
    "pyinstaller>=6.19.0",
]

[project.urls]
Homepage = "https://github.com/Alouetter/Alavette-Form"
Repository = "https://github.com/Alouetter/Alavette-Form.git"
Issues = "https://github.com/Alouetter/Alavette-Form/issues"
Security = "https://github.com/Alouetter/Alavette-Form/security/advisories/new"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
