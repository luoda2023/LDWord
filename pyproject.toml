[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lark-formatter"
version = "1.0.0"
description = "Desktop docx formatting workflow for Lark Formatter V1.0"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "lxml>=5.0.0",
    "PyYAML>=6.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
build = [
    "pyinstaller>=6.19.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
