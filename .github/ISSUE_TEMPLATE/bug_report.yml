name: 缺陷报告
description: 报告可复现的产品问题；不要提交真实文档或密钥
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请只使用合成或彻底脱敏的数据。安全漏洞请按 SECURITY.md 私密报告。
  - type: input
    id: version
    attributes:
      label: 版本与构建哈希
      placeholder: 例如 1.0.0 / ZIP 的 SHA-256
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Windows 版本
      options:
        - Windows 11 x64
        - Windows 10 x64
        - 其他或未知
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用合成文件描述最小复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有附加真实业务文档、个人资料、密钥或令牌。
          required: true
