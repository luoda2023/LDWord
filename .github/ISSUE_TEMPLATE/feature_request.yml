name: 功能建议
description: 提议一个边界清晰、可验证的产品改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 请描述实际使用场景和目标，不要附加真实业务文档、个人资料或凭据。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 目前在什么工作流中遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 完成后用户应该能够做什么？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 可选；说明现有功能或其他方法为何不足。
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我没有附加真实业务文档、个人资料、密钥或令牌。
          required: true
        - label: 这不是安全漏洞；安全漏洞将通过私密渠道报告。
          required: true
