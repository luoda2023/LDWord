# 论文排版默认模板参数 — Alavette Form V1.0
# 仅定义「文档长什么样」，不含功能开关

name: "thesis_default"
description: "学术论文默认排版模板"

# ── 页面设置 ──

page_setup:
  paper_size: A4
  margin:
    top_cm: 3.8
    bottom_cm: 3.8
    left_cm: 3.2
    right_cm: 3.2
  gutter_cm: 0
  header_distance_cm: 3.0
  footer_distance_cm: 3.0

# ── 段落样式 ──

styles:
  normal:
    font_cn: "宋体"
    font_en: "Times New Roman"
    size_pt: 12
    size_display: "小四"
    bold: false
    alignment: "justify"
    first_line_indent_chars: 2
    line_spacing_type: "exact"
    line_spacing_pt: 20

  heading1:
    font_cn: "黑体"
    font_en: "Times New Roman"
    size_pt: 16
    bold: true
    alignment: "center"
    first_line_indent_chars: 0
    space_before_pt: 24
    space_after_pt: 18
    line_spacing_type: "exact"
    line_spacing_pt: 28

  heading2:
    font_cn: "黑体"
    font_en: "Times New Roman"
    size_pt: 14
    bold: true
    alignment: "left"
    first_line_indent_chars: 0
    space_before_pt: 12
    space_after_pt: 12
    line_spacing_type: "exact"
    line_spacing_pt: 24

  heading3:
    font_cn: "黑体"
    font_en: "Times New Roman"
    size_pt: 12
    bold: true
    alignment: "left"
    first_line_indent_chars: 0
    space_before_pt: 6
    space_after_pt: 6
    line_spacing_type: "exact"
    line_spacing_pt: 20

  heading:
    font_cn: "黑体"
    font_en: "Times New Roman"
    size_pt: 12
    bold: true
    alignment: "left"
    first_line_indent_chars: 0

  caption:
    font_cn: "宋体"
    font_en: "Times New Roman"
    size_pt: 10.5
    bold: false
    alignment: "center"
    first_line_indent_chars: 0
    space_before_pt: 6
    space_after_pt: 6
    line_spacing_type: "exact"
    line_spacing_pt: 20

  toc:
    font_cn: "宋体"
    font_en: "Times New Roman"
    size_pt: 12
    alignment: "left"

  references_body:
    font_cn: "宋体"
    font_en: "Times New Roman"
    size_pt: 10.5
    size_display: "五号"
    alignment: "justify"
    first_line_indent_chars: 0
    hanging_indent_chars: 2
    line_spacing_type: "exact"
    line_spacing_pt: 20

  abstract_body:
    font_cn: "宋体"
    font_en: "Times New Roman"
    size_pt: 12
    alignment: "justify"
    first_line_indent_chars: 2
    line_spacing_type: "exact"
    line_spacing_pt: 20

# ── 标题编号 ──

heading_numbering:
  level_bindings:
    heading1:
      enabled: true
      display_core_style: "chinese_chapter"
      chain: "current_only"
      title_separator: "\u3000"
      start_at: 1
      include_in_toc: true
    heading2:
      enabled: true
      display_core_style: "arabic"
      chain: "parent.current"
      title_separator: "\u3000"
      start_at: 1
      include_in_toc: true
    heading3:
      enabled: true
      display_core_style: "arabic"
      chain: "parent.parent.current"
      title_separator: "\u3000"
      start_at: 1
      include_in_toc: true

# ── 标题模型 ──

heading_model:
  # 精确匹配词典: 标题文本完全一致时跳过编号
  non_numbered_title_texts:
    - "参考文献"
    - "致谢"
    - "勘误"
    - "个人简历"
    - "在学期间发表的学术论文与研究成果"
    - "摘要"
    - "Abstract"
    - "目录"
  # 前缀匹配词典: 标题文本以此开头时跳过编号
  non_numbered_prefixes:
    - "附录"
    - "附件"
    - "Appendix"

# ── 题注 ──

caption:
  figure_prefix: "图"
  table_prefix: "表"
  separator: "\u3000"
  placeholder: "[待补充]"
  numbering_format: "chapter.seq"

# ── 表格 ──

table:
  layout_mode: "smart"
  border_mode: "three_line"
  border_width_pt: 0.5
  three_line_header_width_pt: 1.0
  three_line_bottom_width_pt: 0.5
  line_spacing_mode: "single"
  repeat_header: false

# ── 页眉页脚 ──

header_footer:
  header_mode: "styleref"
  page_number_enabled: true
  header_border: true

# ── 公式 ──

formula_table:
  formula_font_name: "Times New Roman"
  formula_font_size_pt: 12.0
  formula_line_spacing: 1.0
  formula_space_before_pt: 6.0
  formula_space_after_pt: 6.0
  block_alignment: "center"
  number_alignment: "right"

equation_numbering:
  numbering_format: "chapter.seq"

# ── 目录 ──

toc:
  mode: "word_native"

# ── 输出 ──

output:
  final_docx: true
  compare_docx: false
  report_json: true
  report_markdown: true
